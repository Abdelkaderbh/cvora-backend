databases:
  - name: cvora-db
    plan: free
    databaseName: cvora
    user: cvora

services:
  - type: web
    name: cvora-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn cvora.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cvora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "cvora-backend-mmbl.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # Set to https://cvora-front.vercel.app (no trailing slash)
      - key: CSRF_TRUSTED_ORIGINS
        sync: false           # Set to https://cvora-front.vercel.app (no trailing slash)
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Resend email API
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_TIMEOUT
        value: "10"
      # AI
      - key: AI_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_FALLBACK_MODEL
        value: "gemini-3.5-flash"
