databases:
  - name: cvora-db
    plan: free
    databaseName: cvora
    user: cvora

services:
  - type: web
    name: cvora-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn cvora.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cvora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "cvora-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # you'll set this manually
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Email
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # AI
      - key: AI_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_FALLBACK_MODEL
        value: "gemini-3.5-flash"
